[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-code-review-agent-lite"
version = "0.7.0"
description = "A beginner-oriented LangGraph code review agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langchain-core>=1.2,<2.0",
    "langchain-openai>=1.3,<2.0",
    "langgraph>=1.2,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
